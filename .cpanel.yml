# =============================================================
# .cpanel.yml — Deploy automatico via Git Version Control di cPanel
# =============================================================
# Quando fai "Update from Remote" + "Deploy HEAD Commit" su cPanel,
# i file vengono copiati nella cartella del sito (public_html).
# IMPORTANTE: aggiorna la riga DEPLOYPATH se usi un sottodominio
# o una sottocartella diversa da public_html.
# =============================================================

---
deployment:
  tasks:
    - /bin/rsync -av --no-perms --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r --exclude='.git' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='_articles' --exclude='_tools' --exclude='*.bat' --exclude='*.sh' --exclude='*.md' /home/ibarbarf/repositories/barbaraspica-sito/ /home/ibarbarf/public_html/
    - /bin/chmod 644 /home/ibarbarf/public_html/.htaccess
