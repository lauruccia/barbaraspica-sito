<!DOCTYPE html>

<style>
  body { background: linear-gradient(180deg, var(--c-cream), #fff); min-height:100dvh; display:grid; place-items:center; padding: 2rem 1rem; }
  .auth-card {
    width: min(100%, 460px);

    padding: 2.4rem 2rem;
    text-align: center;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--c-border);
  }
  .auth-card img { height: 80px; width:auto; margin: 0 auto 1.2rem; display:block; }
  .auth-card h1 { font-size: 1.6rem; margin-bottom: .5rem; }
  .auth-card p { color: var(--c-text-soft); }
  .auth-card .badge { display:inline-block; padding:.4rem 1rem; background: var(--c-accent-50); color: var(--c-accent-dark); border-radius: var(--radius-pill); font-weight:600; font-size:.84rem; letter-spacing:.08em; text-transform: uppercase; margin-bottom: 1.2rem;}

<body>
  <main class="auth-card">

    <p style="margin-top:1.4rem;">

    </p>

      Se sei un paziente o un genitore e vuoi prenotare, vai alla <a href="/contatti.html">pagina contatti</a> oppure scrivimi su WhatsApp.
    </p>
  </main>
